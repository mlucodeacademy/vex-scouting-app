name: VEX Live Tournament Sync

on:
  workflow_dispatch:
  schedule:
    # Runs on Saturday Nov 7 during game day hours (13:30 - 23:59 UTC = 7:30 AM - 5:59 PM CST)
    - cron: '*/5 13-23 7 11 *'
    - cron: '*/5 0 8 11 *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync RobotEvents to Firebase RTDB
        env:
          ROBOTEVENTS_TOKEN: ${{ secrets.ROBOTEVENTS_TOKEN }}
          TZ: America/Chicago
        run: python3 sync_tournament.py --loop 60 --duration 240
