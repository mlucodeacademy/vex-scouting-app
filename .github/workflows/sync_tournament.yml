name: VEX Live Tournament Sync

on:
  workflow_dispatch:
  schedule:
    # Space City Achieve HS Signature Event (Nov 23-24, 2026: 7:30 AM - 7:30 PM CST = 13:30 - 01:30 UTC)
    - cron: '*/5 13-23 23-24 11 *'
    - cron: '*/5 0-1 24-25 11 *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Space City Achieve (RECF C2) to Firebase RTDB
        env:
          TZ: America/Chicago
        run: python3 sync_recf_event.py --event 645 --loop 45 --duration 260
